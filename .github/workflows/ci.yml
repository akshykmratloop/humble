name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: humble
          POSTGRES_PASSWORD: humble_ci_only
          POSTGRES_DB: humble
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U humble -d humble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://humble:humble_ci_only@localhost:5432/humble?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci_only_session_secret_at_least_32_chars
      CORS_ORIGIN: http://localhost:3000
      API_PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run --root packages/domain
      - name: Start API for API-layer tests
        run: |
          cd apps/api
          npx babel-node src/main.js &
          npx wait-on http://localhost:4000/health --timeout 30000
      - run: cd apps/api && npx vitest run src/modules/auth/__tests__/auth-profile.e2e.test.js
      - run: npm run build --workspace=apps/web
